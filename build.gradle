import org.slf4j.event.Level

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

// CI uses the GitHub Actions run number (same as the release tag), local builds use build_number
def buildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: build_number
version = "${minecraft_version}-${mod_version}-${tag_lanzador}-build.${buildNumber}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_named}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientData {
            clientData()
            gameDirectory.set(layout.projectDirectory.dir('run-data'))
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_namespace}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup 'mezz.jei'; includeGroupAndSubgroups 'net.mezzdev' }
    }
    maven {
        // KubeJS runtime dependency (animated-gif-lib)
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.rtyley' }
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

dependencies {
    // JEI -- optional, recipe categories for every Rustic machine.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // KubeJS -- optional, recipe schemas for every Rustic recipe type.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    runtimeOnly "dev.latvian.mods:rhino:${rhino_version}"
    runtimeOnly "dev.latvian.mods:better-advanced-tooltips:${better_advanced_tooltips_version}"

    // Dynamic Trees -- optional, dynamic olive and ironwood trees.
    compileOnly("maven.modrinth:dynamictrees:${dynamictrees_version}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_namespace          : mod_namespace,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            issue_tracker          : issue_tracker,
            kubejs_version_range   : kubejs_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Writes the compile classpath to build/compile-classpath.txt (used for quick javac checks).
tasks.register('writeCompileClasspath') {
    dependsOn 'createMinecraftArtifacts'
    doLast {
        def out = layout.buildDirectory.file('compile-classpath.txt').get().asFile
        out.parentFile.mkdirs()
        out.text = sourceSets.main.compileClasspath.asPath
    }
}
